[project]
name = "hackathon-starter"
version = "1.0.0"
description = "Simple starter module for hackathon"
requires-python = ">=3.10"
dependencies = [
    "openai>=3.0.0",
    "azure-ai-projects>=2.6.1,<3",
    "azure-identity>=1.20.0,<2",
    "python-dotenv==1.0.0",
    "flask==3.1.3",
    "dynaconf>=3.3.0",
    "langgraph>=1.0,<2",
    "langchain-core>=1.0,<2",
    "pydantic>=2,<3"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["client.py", "csv_agent.py", "csv_tools.py", "utils.py", "tools.py"]
